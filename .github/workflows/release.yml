name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A tag push releases that tag. A manual run releases v<project version> at the selected commit.
      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            [xml]$project = Get-Content ClaudeUsageWidget.csproj
            $version = @($project.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
            if (-not $version) { throw 'Project version is missing.' }
            $tag = "v$version"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Reject an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:TAG already exists. Use a new tag."
          }
          $global:LASTEXITCODE = 0

      - name: Restore
        run: dotnet restore WindowsAIStatusBar.slnx

      - name: Core tests
        run: dotnet test tests/StatusBar.Core.Tests/StatusBar.Core.Tests.csproj -c Release --nologo

      # Same command as the manual-test artifact in build.yml, so the released exe matches what was tested.
      - name: Publish single-file exe
        run: dotnet publish ClaudeUsageWidget.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:SourceRevisionId=${{ github.sha }} -o dist

      # The in-app updater looks for exactly these two asset names and expects one AIStatusBar.exe in the zip.
      - name: Package and hash release asset
        shell: pwsh
        run: |
          $asset = 'AIStatusBar-win-x64.zip'
          Compress-Archive -LiteralPath dist/AIStatusBar.exe -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:TAG AIStatusBar-win-x64.zip SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Windows AI Status Bar $env:TAG" `
            --generate-notes
